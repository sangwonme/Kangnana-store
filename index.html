<title>강나나 게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&family=Nanum+Myeongjo:wght@800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0a0909; --card: #151313; --line: #2a2523; --text: #f2e9d0; --dim: #8f877a; --accent: #f2cf22; --blood: #b3261e; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at top, #1c0c0b, var(--bg) 60%); color: var(--text);
    font-family: 'Nanum Gothic', sans-serif; }
  header { padding: 72px 16px 40px; text-align: center; }
  h1 { margin: 0; font: 800 clamp(34px, 7vw, 60px)/1.1 'Nanum Myeongjo', serif; letter-spacing: 2px;
    text-shadow: 0 0 18px rgba(179, 38, 30, 0.55), 0 2px 6px #000; }
  header p { margin: 14px 0 0; color: var(--dim); font-size: 14px; }
  main { max-width: 1040px; margin: 0 auto; padding: 0 16px 80px; display: grid; gap: 24px;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 320px)); justify-content: center; }
  .game { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 6px; overflow: hidden;
    color: inherit; text-decoration: none; transition: transform .2s, border-color .2s, box-shadow .2s; }
  a.game:hover, a.game:focus-visible { transform: translateY(-4px); border-color: var(--accent); outline: none;
    box-shadow: 0 10px 30px rgba(242, 207, 34, 0.12); }
  .thumb { aspect-ratio: 16 / 9; background: #000 center / cover; image-rendering: pixelated; position: relative; }
  .thumb::after { content: '▶'; position: absolute; inset: 0; display: grid; place-items: center; font-size: 40px;
    color: var(--accent); background: rgba(0, 0, 0, 0.45); opacity: 0; transition: opacity .2s; }
  a.game:hover .thumb::after, a.game:focus-visible .thumb::after { opacity: 1; }
  .info { padding: 16px 18px 20px; }
  .info h2 { margin: 0 0 8px; font: 800 21px/1.3 'Nanum Myeongjo', serif; }
  .info p { margin: 0; color: var(--dim); font-size: 14px; line-height: 1.6; }
  .tags { margin-top: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
  .tags span { font-size: 12px; padding: 3px 8px; border: 1px solid var(--line); border-radius: 99px; color: var(--dim); }
  .soon { opacity: 0.45; }
  .soon .thumb { display: grid; place-items: center; color: var(--dim); font-size: 32px; background: repeating-linear-gradient(45deg, #111, #111 10px, #161414 10px, #161414 20px); }
</style>
</head>
<body>
<header>
  <h1>강나나 게임</h1>
  <p>플레이할 게임을 고르세요</p>
</header>
<main>
  <!-- 게임 추가: 아래 <a class="game"> 블록을 복사해서 폴더 이름·썸네일·설명만 바꾸면 됩니다 -->
  <a class="game" href="escape-gangnana/">
    <div class="thumb" style="background-image:url(escape-gangnana/thumb.jpg)"></div>
    <div class="info">
      <h2>동우의 꿈의 가게</h2>
      <p>밤 10시, 동우가 가게를 맡기고 사라졌다. 바나나탈을 쓰고 새벽 2시 마감까지 버텨라.</p>
      <div class="tags"><span>공포</span><span>3D</span><span>PC · 모바일</span></div>
    </div>
  </a>

  <a class="game" href="banana-power/">
    <div class="thumb" style="background-image:url(banana-power/thumb.jpg)"></div>
    <div class="info">
      <h2>무한의 나나</h2>
      <p>좌우로 꺾이는 하늘 계단을 올라라. 바나나 5개를 모으면 강나나로 변신해 한 번에 쭉쭉!</p>
      <div class="tags"><span>캐주얼</span><span>3D</span><span>모바일 · PC</span></div>
    </div>
  </a>

  <a class="game" href="nana-pose/">
    <div class="thumb" style="background-image:url(nana-pose/thumb.jpg)"></div>
    <div class="info">
      <h2>강나나의 멋진 포즈!</h2>
      <p>지하실 생존 오디션. 다가오는 압착기 벽의 구멍에 맞춰 포즈를 바꿔라. 못 맞추면… 끝.</p>
      <div class="tags"><span>공포 코미디</span><span>3D</span><span>모바일 · PC</span></div>
    </div>
  </a>

  <div class="game soon" aria-hidden="true">
    <div class="thumb">?</div>
    <div class="info">
      <h2>다음 게임</h2>
      <p>준비 중</p>
    </div>
  </div>
</main>
</body>
</html>
