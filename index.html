<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>동우의 꿈의 가게</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&family=Nanum+Gothic+Coding:wght@400;700&family=Nanum+Myeongjo:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="view"></canvas>

<div id="crosshair" hidden></div>
<div id="prompt" hidden><b>E</b> 읽기</div>

<div id="reader" hidden>
  <div id="reader-card" class="card"></div>
  <p class="close-hint"><b>E</b> 또는 클릭으로 닫기</p>
</div>

<div id="costume" hidden></div>
<div id="scare" hidden><img src="assets/img/jumpscare.jpg" alt=""></div>

<div id="hud" hidden>
  <div id="clock">22:00</div>
  <div id="hint"></div>
  <div id="ticket" hidden></div>
  <div id="held" hidden></div>
  <div id="toast"></div>
  <div id="progress" hidden><div id="progress-bar"></div></div>
  <div id="costume-hint" hidden><b>Q</b> 바나나탈 벗기</div>
</div>

<div id="namebox" hidden>
  <p class="nb-title">영수증 뒷면에 이름을 적는다</p>
  <input id="name-input" maxlength="12" autocomplete="off" spellcheck="false" placeholder="이름을 입력">
  <p class="nb-hint">Enter로 적기</p>
</div>

<div id="endcard" hidden>
  <p class="end-time">02:00</p>
  <h2>마감</h2>
  <ul id="end-stats"></ul>
  <p id="end-mood"></p>
  <button onclick="location.reload()">다시 출근하기</button>
</div>

<div id="bubble" hidden>
  <div id="bubble-name">동우</div>
  <div id="bubble-text"></div>
</div>

<div id="title">
  <h1>동우의 꿈의 가게</h1>
  <button id="start" disabled>불러오는 중…</button>
</div>

<div id="paused" hidden>
  <p>일시정지</p>
  <p class="note">화면을 클릭하면 계속</p>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
